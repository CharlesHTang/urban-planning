sites:
  - name: aecom
    projects_url: https://aecom.com/projects/
    adapter: architecture_scraper.adapters.sites.aecom:AecomAdapter

    # AECOM exposes both its listing and detail HTML without browser rendering.
    listing_render: never
    detail_render: never

    # One request begins every half-second, with at most five fetch tasks alive.
    concurrency: 5
    request_delay: 0.5
    timeout: 45
    impersonate: chrome

  - name: wsp
    projects_url: https://www.wsp.com/en-gl/projects#sort=date%20descending
    adapter: architecture_scraper.adapters.sites.wsp:WspAdapter

    # WSP's sitemap and detail pages are available through ordinary HTTP.
    listing_render: never
    detail_render: never

    # WSP's robots.txt specifies a three-second crawl delay.
    concurrency: 3
    request_delay: 3
    timeout: 60
    impersonate: safari

  - name: arcadis
    projects_url: https://www.arcadis.com/en/projects
    adapter: architecture_scraper.adapters.sites.arcadis:ArcadisAdapter

    # Arcadis's project grid uses a public JSON search endpoint.
    listing_render: never
    detail_render: never

    concurrency: 5
    request_delay: 1
    timeout: 60
    impersonate: chrome

  - name: jacobs
    projects_url: https://www.jacobs.com/projects
    adapter: architecture_scraper.adapters.sites.jacobs:JacobsAdapter

    # Jacobs serves its paginated listing and detail pages as complete HTML.
    listing_render: never
    detail_render: never

    concurrency: 5
    request_delay: 1
    timeout: 60
    impersonate: chrome

  - name: atkinsrealis
    projects_url: https://www.atkinsrealis.com/en/projects
    adapter: architecture_scraper.adapters.sites.atkinsrealis:AtkinsRealisAdapter

    # The project grid uses a public GET API and complete server-rendered HTML.
    listing_render: never
    detail_render: never

    concurrency: 5
    request_delay: 1
    timeout: 60
    impersonate: safari

  - name: archello
    projects_url: https://archello.com/projects
    adapter: architecture_scraper.adapters.sites.archello:ArchelloAdapter

    # Archello publishes project URLs in sharded XML sitemaps.
    listing_render: never
    detail_render: never

    # Archello's robots.txt specifies a one-second crawl delay.
    concurrency: 3
    request_delay: 1
    timeout: 60
    impersonate: chrome

  - name: stantec
    projects_url: https://www.stantec.com/en/projects
    adapter: architecture_scraper.adapters.sites.stantec:StantecAdapter

    # The project grid uses a paginated public GET endpoint.
    listing_render: never
    detail_render: never

    concurrency: 5
    request_delay: 0.5
    timeout: 60
    impersonate: chrome

  - name: arup
    projects_url: https://www.arup.com/en-us/projects/all-projects/
    adapter: architecture_scraper.adapters.sites.arup:ArupAdapter

    # Arup's project grid uses a paginated public JSON endpoint.
    listing_render: never
    detail_render: never

    concurrency: 5
    request_delay: 0.5
    timeout: 60
    impersonate: chrome
